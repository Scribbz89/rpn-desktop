name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""
        run: npx electron-builder --win --publish never

      - name: Deploy Windows exe to rpn-website
        uses: actions/checkout@v4
        with:
          repository: Scribbz89/rpn-website
          path: rpn-website
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Push Windows exe
        shell: bash
        run: |
          mkdir -p rpn-website/exe
          cp dist/rpn-field-brain.exe rpn-website/exe/rpn-field-brain.exe
          cd rpn-website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add exe/rpn-field-brain.exe
          git diff --staged --quiet || git commit -m "Update Windows build [skip ci]"
          git push

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""
        run: npx electron-builder --linux --publish never

      - name: Upload Linux AppImage as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          files: dist/rpn-field-brain.AppImage
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: Scribbz89/rpn-desktop
