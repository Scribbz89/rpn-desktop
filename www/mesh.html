<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — MeshCore Network</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>
<main>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:#000a;z-index:500;overflow-y:auto;padding:20px;">
  <div style="max-width:560px;margin:0 auto;background:#1a2018;border:1px solid #3a5c2e;border-radius:8px;padding:24px;" id="modalBox"></div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
    <h2 style="margin:0;">MeshCore Network</h2>
    <a href="more.html" style="color:#6dbf5a;font-size:13px;">&#8592; More</a>
</div>
<p class="form-hint" style="margin-bottom:20px;">Track your MeshCore nodes, channels, and contacts. MeshCore operates independently of the internet — devices communicate directly via LoRa radio.</p>

<div class="radio-tabs" id="tabBar"></div>
<div id="tabContent"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script>
const TABS = [
    { id: 'nodes',    label: 'Nodes' },
    { id: 'channels', label: 'Channels' },
    { id: 'contacts', label: 'Contacts' },
    { id: 'notes',    label: 'Notes' },
];

const TAB_HINTS = {
    nodes:    'A MeshCore node is a small LoRa radio device (e.g. T-Beam, Heltec V3) that relays messages without any internet connection. The Node ID starts with ! followed by 8 hex characters — find it in your device\'s MeshCore settings.',
    channels: 'Channels are named communication groups. Channel Index (0, 1, 2…) is the slot number on the device. The Encryption Key secures the channel — all devices on this channel must use the same key. Leave blank to use the default unencrypted channel.',
    contacts: 'Other MeshCore users you communicate with. Their Node ID (e.g. !abcd1234) is the address the mesh uses to reach them.',
    notes:    'Freeform notes — channel plans, frequency settings, device configurations.',
};

const FIELDS = {
    nodes: [
        { id:'name',      label:'Node Name',         type:'text',     placeholder:'e.g. Home Base' },
        { id:'node_id',   label:'Node ID',           type:'text',     placeholder:'e.g. !abcd1234' },
        { id:'hardware',  label:'Hardware',          type:'text',     placeholder:'e.g. T-Beam, Heltec V3' },
        { id:'frequency', label:'Frequency (MHz)',   type:'text',     placeholder:'e.g. 869.525' },
        { id:'location',  label:'Location',          type:'text',     placeholder:'e.g. Roof antenna' },
        { id:'notes',     label:'Notes',             type:'text',     placeholder:'Optional' },
    ],
    channels: [
        { id:'name',      label:'Channel Name',      type:'text',     placeholder:'e.g. Primary' },
        { id:'key',       label:'Encryption Key',    type:'text',     placeholder:'Leave blank if default' },
        { id:'index',     label:'Channel Index',     type:'text',     placeholder:'e.g. 0, 1, 2' },
        { id:'purpose',   label:'Purpose',           type:'text',     placeholder:'e.g. Local comms' },
        { id:'notes',     label:'Notes',             type:'text',     placeholder:'Optional' },
    ],
    contacts: [
        { id:'name',      label:'Name',              type:'text',     placeholder:'e.g. John' },
        { id:'node_id',   label:'Node ID',           type:'text',     placeholder:'e.g. !abcd1234' },
        { id:'callsign',  label:'Callsign / Handle', type:'text',     placeholder:'Optional' },
        { id:'location',  label:'Usual Location',    type:'text',     placeholder:'e.g. Manchester' },
        { id:'notes',     label:'Notes',             type:'text',     placeholder:'Optional' },
    ],
    notes: [
        { id:'title',     label:'Title',             type:'text',     placeholder:'e.g. Channel plan' },
        { id:'body',      label:'Note',              type:'textarea', placeholder:'Write your note here...' },
    ],
};

let activeTab = 'nodes';

function init() {
    renderNav('mesh');
    renderTabs();
    renderTab(activeTab);
}

function renderTabs() {
    document.getElementById('tabBar').innerHTML = TABS.map(t =>
        `<button class="radio-tab${t.id===activeTab?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
    ).join('');
}

function switchTab(id) {
    activeTab = id;
    renderTabs();
    renderTab(id);
}

function renderTab(section) {
    const data = loadMesh();
    const items = data[section] || [];
    const fields = FIELDS[section];
    const isNotes = section === 'notes';

    let tableHtml = '';
    if (items.length === 0) {
        tableHtml = '<p class="empty">No entries yet.</p>';
    } else if (isNotes) {
        tableHtml = items.map((item, idx) => `
            <div class="note-card">
                <div class="note-card-header">
                    <span class="note-title">${escHtml(item.title||'Note')}</span>
                    <div class="actions">
                        <button class="btn-edit" onclick="openEdit('${section}', ${idx})">Edit</button>
                        <button class="delete" onclick="deleteEntry('${section}', ${idx})">Del</button>
                    </div>
                </div>
                <div class="note-body">${escHtml(item.body||'')}</div>
            </div>`).join('');
    } else if (section === 'nodes') {
        tableHtml = `<div class="table-scroll"><table><thead><tr>
            <th>Name</th><th>Node ID</th><th>Hardware</th><th>Freq</th><th>Location</th><th></th>
        </tr></thead><tbody>${items.map((item, idx) => `<tr>
            <td><strong>${escHtml(item.name||'')}</strong></td>
            <td class="freq">${escHtml(item.node_id||'')}</td>
            <td>${escHtml(item.hardware||'')}</td>
            <td class="freq">${escHtml(item.frequency||'')}</td>
            <td>${escHtml(item.location||'')}</td>
            <td class="actions">
                <button class="btn-edit" onclick="openEdit('${section}', ${idx})">Edit</button>
                <button class="delete" onclick="deleteEntry('${section}', ${idx})">Del</button>
            </td>
        </tr>`).join('')}</tbody></table></div>`;
    } else {
        const thCols = fields.filter(f => f.id !== 'notes').map(f => `<th>${escHtml(f.label)}</th>`).join('');
        const rows = items.map((item, idx) => {
            const cells = fields.filter(f => f.id !== 'notes').map(f =>
                `<td>${escHtml(item[f.id]||'')}</td>`
            ).join('');
            return `<tr>${cells}<td class="actions">
                <button class="btn-edit" onclick="openEdit('${section}', ${idx})">Edit</button>
                <button class="delete" onclick="deleteEntry('${section}', ${idx})">Del</button>
            </td></tr>`;
        }).join('');
        tableHtml = `<div class="table-scroll"><table><thead><tr>${thCols}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    const tabHint = TAB_HINTS[section] ? `<p class="form-hint" style="margin-bottom:14px;">${TAB_HINTS[section]}</p>` : '';

    document.getElementById('tabContent').innerHTML = `
        <div class="radio-section">
            ${tabHint}
            <div class="page-actions">
                <button class="btn-primary" onclick="openAdd('${section}')">+ Add Entry</button>
            </div>
            ${tableHtml}
        </div>`;
}

function buildForm(section, item) {
    return FIELDS[section].map(f => {
        const val = escHtml(item ? (item[f.id]||'') : '');
        const inp = f.type === 'textarea'
            ? `<textarea id="ff_${f.id}" placeholder="${escHtml(f.placeholder||'')}">${val}</textarea>`
            : `<input type="text" id="ff_${f.id}" value="${val}" placeholder="${escHtml(f.placeholder||'')}">`;
        return `<div class="form-row"><label class="input-label" style="flex:1">${escHtml(f.label)}${inp}</label></div>`;
    }).join('');
}

function openAdd(section) {
    document.getElementById('modalBox').innerHTML = `
        <h2 style="margin-bottom:16px;">Add Entry</h2>
        ${buildForm(section, null)}
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="saveEntry('${section}', -1)">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>`;
    document.getElementById('modalOverlay').style.display = 'block';
}

function openEdit(section, idx) {
    const data = loadMesh();
    const item = (data[section] || [])[idx];
    document.getElementById('modalBox').innerHTML = `
        <h2 style="margin-bottom:16px;">Edit Entry</h2>
        ${buildForm(section, item)}
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="saveEntry('${section}', ${idx})">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>`;
    document.getElementById('modalOverlay').style.display = 'block';
}

function saveEntry(section, idx) {
    const newItem = {};
    FIELDS[section].forEach(f => {
        const el = document.getElementById('ff_' + f.id);
        newItem[f.id] = el ? el.value.trim() : '';
    });
    const data = loadMesh();
    data[section] = data[section] || [];
    if (idx === -1) data[section].push(newItem);
    else data[section][idx] = newItem;
    saveMesh(data);
    closeModal();
    renderTab(section);
}

function deleteEntry(section, idx) {
    if (!confirm('Delete this entry?')) return;
    const data = loadMesh();
    data[section].splice(idx, 1);
    saveMesh(data);
    renderTab(section);
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

init();
</script>
</body>
</html>
