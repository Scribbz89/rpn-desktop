<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — Medications</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>
<main>
<div style="margin-bottom:12px;"><a href="more.html" style="color:#6dbf5a;font-size:13px;">&#8592; More</a></div>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:#000a;z-index:500;overflow-y:auto;padding:20px;">
  <div style="max-width:560px;margin:0 auto;background:#1a2018;border:1px solid #3a5c2e;border-radius:8px;padding:24px;">
    <h2 id="modalTitle" style="margin-bottom:16px;">Add Medication</h2>
    <div id="modalBody"></div>
  </div>
</div>

<div id="pageContent"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script>
const DOSE_UNITS = ['tablets','capsules','ml','mg','patches','drops','puffs','units','sachets','other'];

let editingId = null;

function init() {
    renderNav('more');
    renderPage();
}

function renderPage() {
    const meds = loadMedications();
    const readiness = calculateMedReadiness(meds);

    const statusClass = readiness.critical > 0 ? 'red' : readiness.low > 0 ? 'amber' : (meds.length > 0 ? 'good' : '');
    const statusLabel = readiness.critical > 0 ? `${readiness.critical} critical` : readiness.low > 0 ? `${readiness.low} running low` : meds.length > 0 ? 'All OK' : '—';

    let listHtml = '';
    if (!meds.length) {
        listHtml = '<div style="background:#1a2018;border:1px solid #2e3d2c;border-radius:8px;padding:18px 20px;text-align:center;">'
            + '<div style="font-size:32px;margin-bottom:10px;">&#10010;</div>'
            + '<div style="font-size:14px;font-weight:700;color:#d4d9d4;margin-bottom:8px;">No medications tracked yet</div>'
            + '<p style="font-size:13px;color:#7a8f78;line-height:1.6;margin:0 0 6px;">Add any prescription or over-the-counter medications you rely on. The app tracks your supply days and alerts you when you\'re running low — so you never get caught without critical medication in an emergency.</p>'
            + '</div>';
    } else {
        // sort: critical first, then low, then ok
        const sorted = [...meds].sort((a, b) => {
            const da = calcMedDays(a) ?? 9999;
            const db = calcMedDays(b) ?? 9999;
            return da - db;
        });
        listHtml = sorted.map(med => {
            const days = calcMedDays(med);
            const statusDot = days === null ? 'green' : days < 7 ? 'red' : days < 14 ? 'amber' : 'green';
            const daysText = days === null ? '' : days === 0 ? '<span style="color:#c0392b;font-size:12px;">Out of stock</span>' : `<span style="color:${days<7?'#c0392b':days<14?'#d4a017':'#6dbf5a'};font-size:12px;">${days} days remaining</span>`;
            const perDay = (Number(med.dose_units)||1) * (Number(med.doses_per_day)||1);
            const doseSummary = `${med.dose_units||1} ${med.unit||'tablet(s)'} × ${med.doses_per_day||1}×/day`;
            return `
            <div style="background:#1a2018;border:1px solid #2e3d2c;border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                <div style="display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;">
                    <span class="status ${statusDot}" style="margin-top:4px;flex-shrink:0;"></span>
                    <div style="min-width:0;">
                        <div style="font-weight:700;color:#d4d9d4;font-size:14px;">${escHtml(med.name)} ${med.daily==='yes' ? '<span style="font-size:10px;background:#1a3a1a;border:1px solid #3a7a2a;color:#6dbf5a;border-radius:4px;padding:1px 6px;vertical-align:middle;">DAILY</span>' : '<span style="font-size:10px;background:#1a1a1a;border:1px solid #2a3a2a;color:#556655;border-radius:4px;padding:1px 6px;vertical-align:middle;">AS NEEDED</span>'}</div>
                        ${med.person ? `<div style="color:#6dbf5a;font-size:12px;">For: ${escHtml(med.person)}</div>` : ''}
                        <div style="color:#7a8f78;font-size:12px;">${escHtml(doseSummary)}</div>
                        <div style="color:#7a8f78;font-size:12px;">Stock: ${escHtml(String(med.stock_quantity||'?'))} ${escHtml(med.unit||'')}</div>
                        ${daysText}
                        ${med.refill_date ? `<div style="color:#7a8f78;font-size:12px;margin-top:2px;">Refill by: ${formatDate(med.refill_date)}</div>` : ''}
                        ${med.prescriber ? `<div style="color:#7a8f78;font-size:12px;">Dr: ${escHtml(med.prescriber)}</div>` : ''}
                        ${med.notes ? `<div style="color:#7a8f78;font-size:12px;margin-top:2px;">${escHtml(med.notes)}</div>` : ''}
                    </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
                    <button class="btn-edit" onclick="openEdit(${med.id})">Edit</button>
                    <button class="delete" onclick="deleteMed(${med.id})">Del</button>
                </div>
            </div>`;
        }).join('');
    }

    document.getElementById('pageContent').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
            <h2 style="margin:0;">Medications</h2>
        </div>
        <p class="form-hint" style="margin-bottom:16px;">Track prescription and OTC medications. The app calculates how many days of supply remain based on dosage and stock.</p>
        <div class="prep-bar" style="margin-bottom:20px;">
            <div class="prep-block ${statusClass}">
                <span class="prep-number">${meds.length}</span>
                <span class="prep-label">Tracked</span>
            </div>
            <div class="prep-block ${readiness.critical > 0 ? 'red' : ''}">
                <span class="prep-number">${readiness.critical}</span>
                <span class="prep-label">Critical (&lt;7d)</span>
            </div>
            <div class="prep-block ${readiness.low > 0 ? 'amber' : ''}">
                <span class="prep-number">${readiness.low}</span>
                <span class="prep-label">Low (&lt;14d)</span>
            </div>
        </div>
        <div class="page-actions"><button class="btn-primary" onclick="openAdd()">+ Add Medication</button></div>
        <div id="medList">${listHtml}</div>
    `;
}

function buildForm(med) {
    const unitOpts = DOSE_UNITS.map(u => `<option value="${u}"${med && med.unit===u?' selected':''}>${u}</option>`).join('');
    return `
    <div class="form-row">
        <label class="input-label" style="flex:2">Medication Name
            <input type="text" id="f_name" value="${escHtml(med?.name||'')}" placeholder="e.g. Metformin 500mg, Ibuprofen">
        </label>
    </div>
    <div class="form-row">
        <label class="input-label">For (person)
            <input type="text" id="f_person" value="${escHtml(med?.person||'')}" placeholder="e.g. John, Mum">
        </label>
        <label class="input-label">Prescription?
            <select id="f_rx">
                <option value="no"${!med||med.rx==='no'?' selected':''}>OTC / No</option>
                <option value="yes"${med&&med.rx==='yes'?' selected':''}>Prescription</option>
            </select>
        </label>
    </div>
    <div class="form-row">
        <label class="input-label" style="flex:1">Taken every day?
            <select id="f_daily">
                <option value="no"${!med||med.daily==='no'||med.daily===undefined?' selected':''}>No — as needed</option>
                <option value="yes"${med&&med.daily==='yes'?' selected':''}>Yes — daily medication</option>
            </select>
        </label>
    </div>
    <p class="form-hint" style="margin-top:-6px;">Daily medications count toward your readiness score. As-needed meds (pain relief, antihistamines etc.) are tracked for awareness only.</p>
    <div class="form-row">
        <label class="input-label">Dose per intake
            <input type="number" id="f_dose_units" value="${escHtml(med?.dose_units||'1')}" placeholder="e.g. 1" min="0.1" step="0.5">
        </label>
        <label class="input-label">Unit
            <select id="f_unit">${unitOpts}</select>
        </label>
    </div>
    <div class="form-row">
        <label class="input-label">Doses per day
            <input type="number" id="f_doses_per_day" value="${escHtml(med?.doses_per_day||'1')}" placeholder="e.g. 2" min="0.5" step="0.5">
        </label>
        <label class="input-label">Stock on hand
            <input type="number" id="f_stock" value="${escHtml(med?.stock_quantity||'')}" placeholder="e.g. 56">
        </label>
    </div>
    <div class="form-row">
        <label class="input-label">Refill / Expiry Date
            <input type="date" id="f_refill" value="${escHtml(med?.refill_date||'')}">
        </label>
        <label class="input-label">Prescriber / Doctor
            <input type="text" id="f_prescriber" value="${escHtml(med?.prescriber||'')}" placeholder="Optional">
        </label>
    </div>
    <div class="form-row">
        <label class="input-label" style="flex:2">Pharmacy / Source
            <input type="text" id="f_pharmacy" value="${escHtml(med?.pharmacy||'')}" placeholder="Optional">
        </label>
    </div>
    <div class="form-row">
        <label class="input-label" style="flex:2">Notes
            <input type="text" id="f_notes" value="${escHtml(med?.notes||'')}" placeholder="Optional — storage requirements, side effects, etc.">
        </label>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
        <button type="button" class="btn-primary" onclick="saveMed()">Save</button>
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>`;
}

function openAdd() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Medication';
    document.getElementById('modalBody').innerHTML = buildForm(null);
    document.getElementById('modalOverlay').style.display = 'block';
}

function openEdit(id) {
    const med = loadMedications().find(m => m.id === id);
    if (!med) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Medication';
    document.getElementById('modalBody').innerHTML = buildForm(med);
    document.getElementById('modalOverlay').style.display = 'block';
}

function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
    editingId = null;
}

function saveMed() {
    const name = document.getElementById('f_name').value.trim();
    if (!name) { alert('Name is required.'); return; }
    const newMed = {
        name,
        person:        document.getElementById('f_person').value.trim(),
        rx:            document.getElementById('f_rx').value,
        dose_units:    document.getElementById('f_dose_units').value,
        unit:          document.getElementById('f_unit').value,
        doses_per_day: document.getElementById('f_doses_per_day').value,
        stock_quantity:document.getElementById('f_stock').value,
        refill_date:   document.getElementById('f_refill').value,
        prescriber:    document.getElementById('f_prescriber').value.trim(),
        pharmacy:      document.getElementById('f_pharmacy').value.trim(),
        notes:         document.getElementById('f_notes').value.trim(),
        daily:         document.getElementById('f_daily').value,
    };
    const meds = loadMedications();
    if (editingId !== null) {
        const idx = meds.findIndex(m => m.id === editingId);
        if (idx !== -1) { newMed.id = editingId; meds[idx] = newMed; }
    } else {
        newMed.id = nextId(meds);
        meds.push(newMed);
    }
    saveMedications(meds);
    closeModal();
    renderPage();
}

function deleteMed(id) {
    if (!confirm('Delete this medication?')) return;
    saveMedications(loadMedications().filter(m => m.id !== id));
    renderPage();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
