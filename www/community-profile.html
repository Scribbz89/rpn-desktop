<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — My Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/leaflet.css">
    <style>
        #locationMap { height: 220px; border-radius: 6px; border: 1px solid var(--border); margin-top: 6px; }
        .loc-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        #locStatus { font-size: 12px; margin-top: 4px; color: var(--accent); display: none; }
    </style>
</head>
<body>
<div id="nav-root"></div>
<main>
    <div style="margin-bottom:12px;"><a href="community-auth.html" style="color:#6dbf5a;font-size:13px;">&#8592; Community</a></div>
    <h2>My Profile</h2>

    <div class="add-form" style="max-width:520px;">
        <div class="form-row">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your name">
        </div>
        <div class="form-row">
            <label>Your Callsign</label>
            <input type="text" id="callsign" placeholder="e.g. M0ABC, CB001">
        </div>
        <div class="form-row">
            <label>RPN Callsign</label>
            <input type="text" id="rpn_callsign" disabled style="opacity:0.5;cursor:not-allowed;">
            <span class="form-hint">Issued by Lewis — contact him to request one.</span>
        </div>
        <div class="form-row">
            <label>Region / County</label>
            <input type="text" id="region" placeholder="e.g. Dorset, West Yorkshire">
        </div>
        <div class="form-row">
            <label>Country</label>
            <input type="text" id="country" placeholder="e.g. England, Scotland, Wales">
        </div>
        <div class="form-row">
            <label>Radios</label>
            <div id="radiosCheckboxes" style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:4px;">
                <!-- populated by JS -->
            </div>
        </div>
        <div class="form-row">
            <label>Frequencies / Channels</label>
            <input type="text" id="frequencies" placeholder="e.g. PMR Ch2, 27.555 CB, 145.500 FM">
        </div>
        <div class="form-row">
            <label>Active Hours</label>
            <input type="text" id="active_hours" placeholder="e.g. Evenings 7pm-10pm GMT">
        </div>
        <div class="form-row">
            <label>Bio</label>
            <textarea id="bio" rows="3" placeholder="Brief description about yourself and your setup"></textarea>
        </div>

        <!-- Location picker -->
        <div class="form-row">
            <label>My Location on Community Map</label>
            <p class="loc-hint">Tap the map to drop your pin. This is where you appear on the community map. Use a rough area — not your exact address.</p>
            <div id="locationMap"></div>
            <div id="locStatus">📍 Location set</div>
            <div style="display:flex;gap:8px;margin-top:6px;">
                <button class="btn-secondary" style="font-size:12px;padding:6px 12px;" onclick="useMyGPS()">Use My GPS</button>
                <button class="btn-cancel" style="font-size:12px;padding:6px 12px;" onclick="clearLocation()">Clear Location</button>
            </div>
        </div>

        <div id="saveMsg" style="display:none;font-size:13px;margin-top:8px;"></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
            <button class="btn-primary" onclick="doSave()" id="saveBtn">Save Profile</button>
            <a href="community-auth.html" class="btn-secondary" style="text-decoration:none;">Back</a>
        </div>
    </div>
</main>

<script src="js/storage.js"></script>
<script src="js/nav.js"></script><script src="js/help.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/community.js"></script>
<script src="js/push.js"></script>
<script>
const RADIO_OPTIONS = [
    'CB', 'PMR446', 'Ham HF', 'Ham VHF/UHF', 'DMR', 'D-STAR',
    'System Fusion (C4FM)', 'MeshCore', 'LoRa/Meshtastic', 'APRS',
    'GMRS/FRS', 'Marine VHF', 'Airband', 'TETRA',
    'Shortwave (RX)', 'MW/AM (RX)'
];

function buildRadioCheckboxes(selected) {
    const sel = (selected || '').split(',').map(s => s.trim()).filter(Boolean);
    document.getElementById('radiosCheckboxes').innerHTML = RADIO_OPTIONS.map(opt => `
        <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer;">
            <input type="checkbox" value="${opt}" ${sel.includes(opt) ? 'checked' : ''}
                style="accent-color:var(--accent);width:16px;height:16px;cursor:pointer;">
            ${opt}
        </label>
    `).join('');
}

function getRadiosValue() {
    return Array.from(document.querySelectorAll('#radiosCheckboxes input:checked'))
        .map(cb => cb.value).join(', ');
}

let locMap, locMarker;
let pickedLat = null, pickedLng = null;

async function init() {
    renderNav('more');
    registerPushNotifications();
    if (!communityToken()) { window.location.href = 'community-auth.html'; return; }

    const user = communityUser() || await communityGetMe();
    const fields = ['name','callsign','rpn_callsign','region','country','frequencies','active_hours','bio'];
    fields.forEach(f => {
        const el = document.getElementById(f);
        if (el && user[f] != null) el.value = user[f];
    });
    buildRadioCheckboxes(user.radios);

    // Init location map
    const startLat = user.lat || 54.0;
    const startLng = user.lng || -2.0;
    const startZoom = user.lat ? 10 : 5;

    locMap = L.map('locationMap').setView([startLat, startLng], startZoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 18,
    }).addTo(locMap);

    if (user.lat && user.lng) {
        setPin(user.lat, user.lng);
    }

    locMap.on('click', function(e) {
        setPin(e.latlng.lat, e.latlng.lng);
    });
}

function setPin(lat, lng) {
    pickedLat = lat;
    pickedLng = lng;
    if (locMarker) locMarker.remove();
    locMarker = L.marker([lat, lng]).addTo(locMap);
    document.getElementById('locStatus').style.display = '';
}

function clearLocation() {
    pickedLat = null; pickedLng = null;
    if (locMarker) { locMarker.remove(); locMarker = null; }
    document.getElementById('locStatus').style.display = 'none';
}

function useMyGPS() {
    if (!navigator.geolocation) { alert('GPS not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(
        pos => {
            setPin(pos.coords.latitude, pos.coords.longitude);
            locMap.setView([pos.coords.latitude, pos.coords.longitude], 12);
        },
        () => alert('Could not get your location. Make sure location permission is granted.')
    );
}

async function doSave() {
    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Saving...'; btn.disabled = true;
    try {
        await communityUpdateMe({
            name:         document.getElementById('name').value.trim() || null,
            callsign:     document.getElementById('callsign').value.trim() || null,
            region:       document.getElementById('region').value.trim() || null,
            country:      document.getElementById('country').value.trim() || null,
            radios:       getRadiosValue() || null,
            frequencies:  document.getElementById('frequencies').value.trim() || null,
            active_hours: document.getElementById('active_hours').value.trim() || null,
            bio:          document.getElementById('bio').value.trim() || null,
            lat:          pickedLat,
            lng:          pickedLng,
        });
        const msg = document.getElementById('saveMsg');
        msg.style.display = '';
        msg.style.color = 'var(--accent)';
        msg.textContent = '✓ Profile saved.';
        setTimeout(() => window.location.href = 'community-auth.html', 1200);
    } catch(e) {
        const msg = document.getElementById('saveMsg');
        msg.style.display = '';
        msg.style.color = 'var(--red)';
        msg.textContent = e.message;
    } finally {
        btn.textContent = 'Save Profile'; btn.disabled = false;
    }
}

init();
</script>
</body>
</html>
