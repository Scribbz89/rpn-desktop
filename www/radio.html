<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — Radio Notebook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>
<main>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:#000a;z-index:500;overflow-y:auto;padding:20px;">
  <div style="max-width:560px;margin:0 auto;background:#1a2018;border:1px solid #3a5c2e;border-radius:8px;padding:24px;" id="modalBox"></div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
    <h2 style="margin:0;">Radio Notebook</h2>
    <a href="more.html" style="color:#6dbf5a;font-size:13px;">&#8592; More</a>
</div>
<p class="form-hint" style="margin-bottom:16px;">Your personal radio reference — store frequencies, repeater details, contacts, and nets all in one place. Everything is saved locally on your device.</p>

<div class="radio-tabs" id="tabBar"></div>
<div id="tabContent"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script src="js/community.js"></script>
<script>
const TABS = [
    { id: 'frequencies', label: 'Frequencies' },
    { id: 'repeaters',   label: 'Repeaters' },
    { id: 'contacts',    label: 'Contacts' },
    { id: 'nets',        label: 'Nets' },
    { id: 'equipment',   label: 'Equipment' },
    { id: 'notes',       label: 'Notes' },
];

const FIELDS = {
    frequencies: [
        { id:'name',      label:'Name / Purpose',    type:'text',   placeholder:'e.g. Local Net Primary' },
        { id:'frequency', label:'Frequency (MHz)',   type:'text',   placeholder:'e.g. 145.500' },
        { id:'mode',      label:'Mode',              type:'text',   placeholder:'e.g. FM, SSB, USB, AM, CW' },
        { id:'ctcss',     label:'CTCSS / DCS',       type:'text',   placeholder:'e.g. 88.5Hz' },
        { id:'band',      label:'Band',              type:'text',   placeholder:'e.g. 2m, 70cm, HF, CB, PMR' },
        { id:'notes',     label:'Notes',             type:'text',   placeholder:'Optional' },
    ],
    repeaters: [
        { id:'name',      label:'Callsign / Name',   type:'text',   placeholder:'e.g. GB3XY' },
        { id:'output',    label:'Output (MHz)',      type:'text',   placeholder:'e.g. 145.625' },
        { id:'input',     label:'Input (MHz)',       type:'text',   placeholder:'e.g. 145.025' },
        { id:'ctcss',     label:'CTCSS',             type:'text',   placeholder:'e.g. 82.5Hz' },
        { id:'location',  label:'Location',          type:'text',   placeholder:'e.g. Pennines' },
        { id:'notes',     label:'Notes',             type:'text',   placeholder:'Optional' },
    ],
    contacts: [
        { id:'name',      label:'Name',              type:'text',   placeholder:'e.g. John' },
        { id:'callsign',  label:'Callsign',          type:'text',   placeholder:'e.g. M0ABC' },
        { id:'frequency', label:'Primary Freq (MHz)',type:'text',   placeholder:'e.g. 145.500' },
        { id:'schedule',  label:'Schedule / Time',   type:'text',   placeholder:'e.g. Sundays 19:00 UTC' },
        { id:'notes',     label:'Notes',             type:'text',   placeholder:'Optional' },
    ],
    nets: [
        { id:'name',      label:'Net Name',          type:'text',   placeholder:'e.g. RPN Weekly Net' },
        { id:'frequency', label:'Frequency (MHz)',   type:'text',   placeholder:'e.g. 7.160' },
        { id:'mode',      label:'Mode',              type:'text',   placeholder:'e.g. LSB' },
        { id:'schedule',  label:'Schedule',          type:'text',   placeholder:'e.g. Mon/Wed/Fri 20:00 UTC' },
        { id:'net_control',label:'Net Control',      type:'text',   placeholder:'Optional callsign' },
        { id:'notes',     label:'Notes',             type:'text',   placeholder:'Optional' },
    ],
    equipment: [
        { id:'name',      label:'Name / Model',      type:'text',   placeholder:'e.g. Baofeng UV-5R' },
        { id:'type',      label:'Type',              type:'text',   placeholder:'e.g. HT, Mobile, Base, CB, SDR' },
        { id:'bands',     label:'Bands',             type:'text',   placeholder:'e.g. 2m/70cm' },
        { id:'power',     label:'Power (W)',         type:'text',   placeholder:'e.g. 5W' },
        { id:'serial',    label:'Serial / ID',       type:'text',   placeholder:'Optional' },
        { id:'notes',     label:'Notes',             type:'text',   placeholder:'Optional' },
    ],
    notes: [
        { id:'title',     label:'Title',             type:'text',   placeholder:'e.g. SHTF frequency plan' },
        { id:'body',      label:'Note',              type:'textarea',placeholder:'Write your note here...' },
    ],
};

let activeTab = 'frequencies';
let _rpnContacts = [];

async function init() {
    renderNav('radio');
    renderTabs();
    if (communityToken()) {
        try { _rpnContacts = await communityGetContacts(); } catch(e) {}
    }
    renderTab(activeTab);
}

function renderTabs() {
    document.getElementById('tabBar').innerHTML = TABS.map(t =>
        `<button class="radio-tab${t.id===activeTab?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
    ).join('');
}

function switchTab(id) {
    activeTab = id;
    renderTabs();
    renderTab(id);
}

const TAB_HINTS = {
    frequencies: 'Store your key channels here — local repeater output, emergency calling frequencies, simplex contacts. CTCSS/DCS is the sub-audible tone your radio needs to open the squelch on a repeater or shared channel.',
    repeaters:   'A repeater receives on the Input frequency and retransmits on the Output. Your radio should be set to transmit on the Input and receive on the Output. CTCSS is a tone that activates the repeater.',
    contacts:    'Radio contacts and schedules. RPN members you have connected with in the community will also appear here automatically.',
    nets:        'A net is a scheduled group radio session. Add the frequency, mode, and time so you don\'t miss it during an emergency.',
    equipment:   'Log your radios and accessories. Useful for insurance, repair, and sharing your capabilities with the community.',
    notes:       'Freeform notes — frequency plans, PACE plans, phonetic alphabet, antenna notes, anything you want to keep handy.',
};

function renderTab(section) {
    const data = loadRadio();
    const items = data[section] || [];
    const fields = FIELDS[section];

    // Table columns
    const isNotes = section === 'notes';
    let tableHtml = '';
    if (items.length === 0) {
        const emptyLabels = { frequencies:'frequency', repeaters:'repeater', contacts:'contact', nets:'net', equipment:'radio', notes:'note' };
        tableHtml = '<p class="empty">No ' + (emptyLabels[section]||'entry') + 's saved yet &mdash; tap + Add Entry above to get started.</p>';
    } else if (isNotes) {
        tableHtml = items.map((item, idx) => `
            <div class="note-card">
                <div class="note-card-header">
                    <span class="note-title">${escHtml(item.title||'Note')}</span>
                    <div class="actions">
                        <button class="btn-edit" onclick="openEdit('${section}', ${idx})">Edit</button>
                        <button class="delete" onclick="deleteEntry('${section}', ${idx})">Del</button>
                    </div>
                </div>
                <div class="note-body">${escHtml(item.body||'')}</div>
            </div>`).join('');
    } else {
        const thCols = fields.filter(f => f.id !== 'notes').map(f => `<th>${escHtml(f.label)}</th>`).join('');
        const rows = items.map((item, idx) => {
            const cells = fields.filter(f => f.id !== 'notes').map(f => {
                const val = item[f.id] || '""';
                const style = f.id === 'frequency' || f.id === 'output' || f.id === 'input' ? ' class="freq"' : '';
                return `<td${style}>${escHtml(val)}</td>`;
            }).join('');
            const notesVal = item.notes ? `<br><span class="sub">${escHtml(item.notes)}</span>` : '';
            return `<tr>
                ${cells}
                <td class="actions">
                    <button class="btn-edit" onclick="openEdit('${section}', ${idx})">Edit</button>
                    <button class="delete" onclick="deleteEntry('${section}', ${idx})">Del</button>
                </td>
            </tr>`;
        }).join('');
        tableHtml = `<div class="table-scroll"><table><thead><tr>${thCols}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    let rpnHtml = '';
    if (section === 'contacts' && _rpnContacts.length) {
        rpnHtml = `
        <div style="margin-bottom:16px;">
            <div style="font-size:11px;color:#7a8f78;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">RPN Contacts</div>
            ${_rpnContacts.map(c => {
                const cs = [c.rpn_callsign, c.callsign].filter(Boolean).join(' / ') || '—';
                return `<div style="background:#1a2a1a;border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:3px solid #6dbf5a;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <div style="font-weight:700;color:#d4d9d4;font-size:14px;">${escHtml(c.name)}</div>
                            <div style="color:#6dbf5a;font-size:12px;">${escHtml(cs)}</div>
                            ${c.radios ? `<div style="color:#7a8f78;font-size:12px;">📻 ${escHtml(c.radios)}</div>` : ''}
                            ${c.active_hours ? `<div style="color:#7a8f78;font-size:12px;">🕐 ${escHtml(c.active_hours)}</div>` : ''}
                            ${c.region ? `<div style="color:#7a8f78;font-size:12px;">📍 ${escHtml(c.region)}</div>` : ''}
                        </div>
                        <span style="font-size:11px;color:#4a6a4a;border:1px solid #2a4a2a;padding:3px 8px;border-radius:4px;">RPN</span>
                    </div>
                </div>`;
            }).join('')}
        </div>
        ${items.length ? `<div style="font-size:11px;color:#7a8f78;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">My Contacts</div>` : ''}`;
    }

    const tabHint = TAB_HINTS[section] ? `<p class="form-hint" style="margin-bottom:14px;">${TAB_HINTS[section]}</p>` : '';

    document.getElementById('tabContent').innerHTML = `
        <div class="radio-section">
            ${tabHint}
            <div class="page-actions">
                <button class="btn-primary" onclick="openAdd('${section}')">+ Add Entry</button>
            </div>
            ${rpnHtml}
            ${tableHtml}
        </div>`;
}

function buildForm(section, item) {
    const fields = FIELDS[section];
    return fields.map(f => {
        const val = escHtml(item ? (item[f.id]||'') : '');
        const inp = f.type === 'textarea'
            ? `<textarea id="ff_${f.id}" placeholder="${escHtml(f.placeholder||'')}">${val}</textarea>`
            : `<input type="text" id="ff_${f.id}" value="${val}" placeholder="${escHtml(f.placeholder||'')}">`;
        return `<div class="form-row"><label class="input-label" style="flex:1">${escHtml(f.label)}${inp}</label></div>`;
    }).join('');
}

function openAdd(section) {
    document.getElementById('modalBox').innerHTML = `
        <h2 style="margin-bottom:16px;">Add Entry</h2>
        ${buildForm(section, null)}
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="saveEntry('${section}', -1)">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>`;
    document.getElementById('modalOverlay').style.display = 'block';
}

function openEdit(section, idx) {
    const data = loadRadio();
    const item = (data[section] || [])[idx];
    document.getElementById('modalBox').innerHTML = `
        <h2 style="margin-bottom:16px;">Edit Entry</h2>
        ${buildForm(section, item)}
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="saveEntry('${section}', ${idx})">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>`;
    document.getElementById('modalOverlay').style.display = 'block';
}

function saveEntry(section, idx) {
    const fields = FIELDS[section];
    const newItem = {};
    fields.forEach(f => {
        const el = document.getElementById('ff_' + f.id);
        newItem[f.id] = el ? el.value.trim() : '';
    });
    const data = loadRadio();
    data[section] = data[section] || [];
    if (idx === -1) data[section].push(newItem);
    else data[section][idx] = newItem;
    saveRadio(data);
    closeModal();
    renderTab(section);
}

function deleteEntry(section, idx) {
    if (!confirm('Delete this entry?')) return;
    const data = loadRadio();
    data[section].splice(idx, 1);
    saveRadio(data);
    renderTab(section);
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

init();
</script>
</body>
</html>
