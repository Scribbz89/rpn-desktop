<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — Stockpile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>
<main>
<div style="margin-bottom:12px;"><a href="home.html" style="color:#6dbf5a;font-size:13px;">&#8592; Home</a></div>

<!-- Add / Edit modal -->
<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:#000a;z-index:500;overflow-y:auto;padding:20px;">
  <div style="max-width:560px;margin:0 auto;background:#1a2018;border:1px solid #3a5c2e;border-radius:8px;padding:24px;">
    <h2 id="modalTitle" style="margin-bottom:16px;">Add Item</h2>
    <div id="modalBody"></div>
  </div>
</div>

<div id="pageContent"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script>
let editingId = null;
let editingLocId = null;
let currentView = 'category';

function isGroupCollapsed(gid) {
    const s = localStorage.getItem('rpn_grp_' + gid);
    return s === '1';
}

function toggleGroup(gid) {
    const key = 'rpn_grp_' + gid;
    localStorage.setItem(key, localStorage.getItem(key) === '1' ? '0' : '1');
    renderPage();
}

function groupHeader(gid, label, count, collapsed) {
    return groupHeaderRaw(escHtml(label), gid, count, collapsed);
}

function groupHeaderRaw(labelHtml, gid, count, collapsed) {
    return '<div onclick="toggleGroup(\'' + gid + '\')" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;user-select:none;">'
        + '<h3 style="margin:0;display:flex;align-items:center;gap:8px;">'
        + labelHtml
        + '<span style="font-size:12px;font-weight:400;color:#7a8f78;">' + count + ' item' + (count !== 1 ? 's' : '') + '</span>'
        + '</h3>'
        + '<span style="font-size:16px;color:#6dbf5a;transition:transform .2s;' + (collapsed ? 'transform:rotate(-90deg)' : '') + '">&#9660;</span>'
        + '</div>';
}


function init() {
    renderNav('stockpile');
    renderPage();
}

function renderPage() {
    const items = applyExpiryStatus(loadStockpile());
    const profile = loadHousehold();
    const prep = calculatePreparedness(items, profile);
    const power = calculatePower(items);

    const foodClass  = prep.food_days  >= 14 ? 'good' : prep.food_days  >= 3 ? 'amber' : 'red';
    const waterClass = prep.water_days >= 7  ? 'good' : prep.water_days >= 2 ? 'amber' : 'red';
    const attnClass  = prep.attention_count === 0 ? 'good' : prep.attention_count <= 5 ? 'amber' : 'red';
    const powerClass = power.generator_hours >= 24 ? 'good' : power.generator_hours >= 4 ? 'amber' : (power.generator_hours > 0 ? 'red' : '');

    const viewTabs = '<div class="radio-tabs" style="margin-bottom:16px;">'
        + '<button class="radio-tab' + (currentView==='category'?' active':'') + '" onclick="switchView(\'category\')">By Category</button>'
        + '<button class="radio-tab' + (currentView==='location'?' active':'') + '" onclick="switchView(\'location\')">By Location</button>'
        + '<button class="radio-tab' + (currentView==='locations'?' active':'') + '" onclick="switchView(\'locations\')">Manage Locations</button>'
        + '</div>';

    const statBar = '<div class="prep-bar">'
        + '<div class="prep-block ' + foodClass + '"><span class="prep-number">' + prep.food_days + '</span><span class="prep-label">Days of Food</span></div>'
        + '<div class="prep-block ' + waterClass + '"><span class="prep-number">' + prep.water_days + '</span><span class="prep-label">Days of Water</span></div>'
        + '<div class="prep-block ' + powerClass + '"><span class="prep-number">' + (power.generator_hours > 0 ? power.generator_hours+'h' : (power.stored_wh > 0 ? power.stored_wh+'Wh' : '&mdash;')) + '</span><span class="prep-label">' + (power.generator_hours > 0 ? 'Generator Runtime' : 'Stored Energy') + '</span></div>'
        + '<div class="prep-block ' + attnClass + '"><span class="prep-number">' + prep.attention_count + '</span><span class="prep-label">Need Attention</span></div>'
        + '</div>'
        + '<div class="legend">'
        + '<span><span class="status green"></span> Good</span>'
        + '<span><span class="status amber"></span> Expires &lt;30 days</span>'
        + '<span><span class="status red"></span> Expired</span>'
        + '</div>';

    const addBtn = '<div class="page-actions"><button class="btn-primary" onclick="openAdd()">+ Add Item</button><a href="audit.html" class="btn-secondary" style="display:inline-block;padding:10px 16px;border-radius:6px;background:#1a2a1a;border:1px solid #3a5a2a;color:#6dbf5a;text-decoration:none;font-size:13px;font-weight:700;">&#10003; Stocktake</a></div>';
    const searchBar = '<div class="search-bar"><input type="text" id="searchInput" placeholder="Search items..." oninput="filterTable(this.value)"></div>';

    let mainContent = '';

    if (currentView === 'category') {
        const groups = {};
        items.forEach(function(item) {
            const cat = item.category || 'Other';
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(item);
        });
        let tableHtml = '';
        if (items.length === 0) {
            tableHtml = '<p class="empty">No items yet. Tap + Add Item to get started.</p>';
        } else {
            for (const cat of CATEGORIES) {
                const catItems = groups[cat];
                if (!catItems || catItems.length === 0) continue;
                const gid = 'grp_cat_' + cat.replace(/\s+/g,'_');
                const collapsed = isGroupCollapsed(gid);
                tableHtml += '<div class="category-block">'
                    + groupHeader(gid, cat, catItems.length, collapsed);
                if (!collapsed) {
                    catItems.forEach(function(item) { tableHtml += renderItemRow(item, false); });
                    if (cat === 'Power') tableHtml += renderPowerSummary(items);
                }
                tableHtml += '</div>';
            }
        }
        mainContent = searchBar + addBtn + '<div id="tableWrap">' + tableHtml + '</div>';

    } else if (currentView === 'location') {
        const locs = loadLocations();
        const tree = getLocTree(locs);
        const byLoc = {};
        const noLoc = [];
        items.forEach(function(item) {
            const loc = (item.location || '').trim();
            if (!loc) { noLoc.push(item); return; }
            if (!byLoc[loc]) byLoc[loc] = [];
            byLoc[loc].push(item);
        });
        const locNames = locs.map(function(l) { return l.name; });
        const adhocNames = Object.keys(byLoc).filter(function(k) { return !locNames.includes(k); });

        let locHtml = '';
        if (items.length === 0) {
            locHtml = '<p class="empty">No items yet. Tap + Add Item to get started.</p>';
        } else {
            tree.forEach(function(node) {
                const locName = node.loc.name;
                const locItems = byLoc[locName] || [];
                // Count direct child sub-locations + direct items for the header number
                const childLocCount = node.depth === 0
                    ? tree.filter(function(c) { return c.depth > 0 && Number(c.loc.parent_id) === Number(node.loc.id); }).length
                    : 0;
                const displayCount = locItems.length + childLocCount;
                if (!displayCount) return;
                const extraStyle = node.depth > 0 ? 'margin-left:16px;padding-left:12px;border-left:2px solid #2a4a2a;' : '';
                const gid = 'grp_loc_' + locName.replace(/\s+/g,'_');
                const collapsed = isGroupCollapsed(gid);
                locHtml += '<div class="category-block" style="' + extraStyle + '">'
                    + groupHeaderRaw((node.loc.icon ? node.loc.icon + ' ' : '') + escHtml(locName), gid, displayCount, collapsed);
                if (!collapsed) locItems.forEach(function(item) { locHtml += renderItemRow(item, true); });
                locHtml += '</div>';
            });
            adhocNames.forEach(function(locName) {
                const locItems = byLoc[locName] || [];
                if (!locItems.length) return;
                const gid = 'grp_loc_' + locName.replace(/\s+/g,'_');
                const collapsed = isGroupCollapsed(gid);
                locHtml += '<div class="category-block">'
                    + groupHeader(gid, locName, locItems.length, collapsed);
                if (!collapsed) locItems.forEach(function(item) { locHtml += renderItemRow(item, true); });
                locHtml += '</div>';
            });
            if (noLoc.length) {
                const gid = 'grp_loc_Unassigned';
                const collapsed = isGroupCollapsed(gid);
                locHtml += '<div class="category-block">'
                    + groupHeader(gid, 'Unassigned', noLoc.length, collapsed);
                if (!collapsed) noLoc.forEach(function(item) { locHtml += renderItemRow(item, true); });
                locHtml += '</div>';
            }
            if (!tree.some(function(n) { return byLoc[n.loc.name]; }) && !adhocNames.length && !noLoc.length) {
                locHtml = '<p class="empty">No items yet.</p>';
            }
        }
        mainContent = searchBar + addBtn + '<div id="tableWrap">' + locHtml + '</div>';

    } else if (currentView === 'locations') {
        mainContent = renderLocationsManager(items);
    }

    document.getElementById('pageContent').innerHTML = statBar + viewTabs + mainContent;
}

function switchView(v) { currentView = v; renderPage(); }

function renderItemRow(item, showCat) {
    let detail = '';
    if (item.category === 'Food') detail = escHtml(item.food_type || '');
    else if (item.category === 'Power') {
        if (item.power_type === 'Generator' && item.fuel_consumption_lph && item.fuel_litres) {
            const hrs = Math.round((Number(item.fuel_litres) / Number(item.fuel_consumption_lph)) * 10) / 10;
            detail = escHtml(item.power_type) + ' &middot; ' + hrs + 'h runtime';
        } else if (['Power Bank','Battery Pack','UPS'].includes(item.power_type) && item.capacity_wh) {
            detail = escHtml(item.power_type) + ' &middot; ' + item.capacity_wh + 'Wh';
        } else if (item.power_type === 'Solar Panel' && item.output_w) {
            detail = escHtml(item.power_type) + ' &middot; ' + item.output_w + 'W';
        } else {
            detail = escHtml(item.power_type || '');
        }
    } else if (item.category === 'Water') {
        detail = item.weight_g ? (Number(item.weight_g)/1000) + 'L' : '';
    } else {
        detail = escHtml(item.notes || '');
    }
    const qty = item.category !== 'Power' && item.quantity ? 'Qty: ' + escHtml(item.quantity) : (item.quantity && item.quantity !== '1' ? 'x' + escHtml(item.quantity) : '');
    const expiry = item.expiry
        ? (item._days_to_expiry !== null && item._days_to_expiry <= 30
            ? '<span style="color:' + (item._status==='red'?'#c0392b':'#d4a017') + ';font-size:11px;">' + (item._days_to_expiry < 0 ? 'Expired' : item._days_to_expiry+'d left') + '</span>'
            : '<span style="font-size:11px;color:#7a8f78;">' + formatDate(item.expiry) + '</span>')
        : '';
    const calText = item.category === 'Food' && item.weight_g
        ? '<span style="font-size:11px;color:#4a5e48;"> &middot; ' + Math.round((Number(item.weight_g)/100)*(Number(item.calories_per_100g)||FOOD_CALORIES[item.food_type]||200)) + 'kcal</span>' : '';
    const catBadge = showCat ? '<span style="font-size:11px;color:#4a6a4a;background:#0f1a0f;border-radius:3px;padding:1px 5px;margin-left:4px;">' + escHtml(item.category) + '</span>' : '';
    const detailQty = [detail, qty].filter(Boolean).join(' &middot; ');
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a2a18;gap:10px;">'
        + '<span class="status ' + item._status + '" style="flex-shrink:0;margin-top:2px;"></span>'
        + '<div style="flex:1;min-width:0;">'
        + '<div style="font-weight:600;font-size:14px;color:#d4d9d4;">' + escHtml(item.name) + calText + catBadge + '</div>'
        + (detailQty ? '<div style="font-size:12px;color:#7a8f78;margin-top:2px;">' + detailQty + '</div>' : '')
        + (expiry ? '<div style="margin-top:2px;">' + expiry + '</div>' : '')
        + '</div>'
        + '<div style="display:flex;gap:6px;flex-shrink:0;">'
        + '<button class="btn-edit" onclick="openEdit(' + item.id + ')">Edit</button>'
        + '<button class="delete" onclick="deleteItem(' + item.id + ')">Del</button>'
        + '</div></div>';
}

function getLocTree(locs) {
    const result = [];
    const topLevel = locs.filter(function(l) { return !l.parent_id; });
    topLevel.forEach(function(p) {
        result.push({ loc: p, depth: 0 });
        locs.filter(function(l) { return Number(l.parent_id) === Number(p.id); }).forEach(function(c) {
            result.push({ loc: c, depth: 1 });
        });
    });
    // Orphaned children (parent was deleted)
    locs.filter(function(l) { return l.parent_id && !locs.find(function(p) { return Number(p.id) === Number(l.parent_id); }); }).forEach(function(c) {
        result.push({ loc: c, depth: 0 });
    });
    return result;
}

function renderLocationsManager(items) {
    const locs = loadLocations();
    const tree = getLocTree(locs);
    const itemCounts = {};
    items.forEach(function(item) {
        const loc = (item.location || '').trim();
        if (loc) itemCounts[loc] = (itemCounts[loc] || 0) + 1;
    });
    // Add child counts to parent locations
    tree.forEach(function(node) {
        if (node.depth > 0 && node.loc.parent_id) {
            const parentLoc = locs.find(function(l) { return Number(l.id) === Number(node.loc.parent_id); });
            if (parentLoc) itemCounts[parentLoc.name] = (itemCounts[parentLoc.name] || 0) + (itemCounts[node.loc.name] || 0);
        }
    });
    const DEFAULT_LOCS = ['Kitchen','Pantry / Food Store','Garage','Garden Shed','Car Boot','Go-Bag','First Aid Kit','Loft / Attic','Bedroom','Living Room'];
    let locList = '';
    if (locs.length === 0) {
        locList = '<p class="empty" style="margin-bottom:16px;">No locations yet. Add one below or pick from the suggestions.</p>';
    } else {
        tree.forEach(function(node) {
            const loc = node.loc;
            const indent = node.depth > 0 ? 'margin-left:14px;padding-left:12px;border-left:2px solid #2a4a2a;' : '';
            const count = itemCounts[loc.name] || 0;
            const parentLoc = loc.parent_id ? locs.find(function(l) { return Number(l.id) === Number(loc.parent_id); }) : null;
            locList += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a2a18;gap:10px;' + indent + '">'
                + '<div style="flex:1;min-width:0;">'
                + '<div style="font-size:15px;font-weight:600;color:#d4d9d4;">' + (loc.icon||'') + ' ' + escHtml(loc.name) + '</div>'
                + (parentLoc ? '<div style="font-size:11px;color:#4a6a4a;margin-top:1px;">in ' + escHtml(parentLoc.name) + '</div>' : '')
                + (loc.desc ? '<div style="font-size:12px;color:#7a8f78;margin-top:2px;">' + escHtml(loc.desc) + '</div>' : '')
                + '<div style="font-size:12px;color:#4a6a4a;margin-top:2px;">' + count + ' item' + (count!==1?'s':'') + '</div>'
                + '</div>'
                + '<div style="display:flex;gap:6px;flex-shrink:0;">'
                + '<button class="btn-edit" onclick="openEditLoc(' + loc.id + ')">Edit</button>'
                + '<button class="delete" onclick="deleteLoc(' + loc.id + ')">Del</button>'
                + '</div></div>';
        });
    }
    const savedNames = locs.map(function(l) { return l.name; });
    const suggestions = DEFAULT_LOCS.filter(function(n) { return !savedNames.includes(n); });
    const suggHtml = suggestions.length
        ? '<div style="margin-top:20px;"><div style="font-size:12px;color:#7a8f78;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Quick add</div>'
          + '<div style="display:flex;flex-wrap:wrap;gap:8px;">'
          + suggestions.map(function(n) {
              return '<button onclick="quickAddLoc(this.dataset.name)" data-name="' + escHtml(n) + '" style="padding:7px 12px;background:#0f1a0f;border:1px solid #2a4a2a;border-radius:20px;color:#6dbf5a;font-size:13px;cursor:pointer;">' + escHtml(n) + '</button>';
          }).join('')
          + '</div></div>'
        : '';
    return '<div>'
        + '<div class="page-actions" style="margin-bottom:0;"><button class="btn-primary" onclick="openAddLoc()">+ Add Location</button></div>'
        + '<div style="margin-top:12px;">' + locList + '</div>'
        + suggHtml
        + '<p style="font-size:12px;color:#4a5e48;margin-top:20px;line-height:1.6;">Locations help you find items quickly. Assign a location to any item when adding or editing it.</p>'
        + '</div>';
}

function openAddLoc() {
    editingLocId = null;
    document.getElementById('modalTitle').textContent = 'Add Location';
    document.getElementById('modalBody').innerHTML = buildLocForm(null);
    document.getElementById('modalOverlay').style.display = 'block';
}

function openEditLoc(id) {
    id = Number(id);
    const loc = loadLocations().find(function(l) { return Number(l.id) === id; });
    if (!loc) return;
    editingLocId = id;
    document.getElementById('modalTitle').textContent = 'Edit Location';
    document.getElementById('modalBody').innerHTML = buildLocForm(loc);
    document.getElementById('modalOverlay').style.display = 'block';
}

function buildLocForm(loc) {
    const locs = loadLocations();
    const ICONS = ['🏠','🏭','🚗','📦','⚒','🏥','💊','📍','💪','🛖'];
    const iconPicker = ICONS.map(function(ic) {
        const sel = loc && loc.icon === ic;
        return '<button type="button" onclick="pickLocIcon(this, this.dataset.icon)" data-icon="' + escHtml(ic) + '" style="font-size:20px;padding:6px 8px;background:' + (sel?'#2a4a2a':'#0f1a0f') + ';border:1px solid ' + (sel?'#6dbf5a':'#2a4a2a') + ';border-radius:6px;cursor:pointer;">' + ic + '</button>';
    }).join('');
    // Only top-level locations can be parents (one level deep max), exclude self
    const topLevel = locs.filter(function(l) { return !l.parent_id && Number(l.id) !== Number(loc && loc.id); });
    const parentOpts = '<option value="">-- None (top level) --</option>'
        + topLevel.map(function(l) {
            const sel = loc && Number(loc.parent_id) === Number(l.id);
            return '<option value="' + l.id + '"' + (sel?' selected':'') + '>' + (l.icon?l.icon+' ':'') + escHtml(l.name) + '</option>';
        }).join('');
    return '<div class="form-row"><label class="input-label" style="flex:1">Name<input type="text" id="f_loc_name" value="' + escHtml(loc&&loc.name||'') + '" placeholder="e.g. Garage"></label></div>'
        + '<div class="form-row"><label class="input-label" style="flex:1">Description (optional)<input type="text" id="f_loc_desc" value="' + escHtml(loc&&loc.desc||'') + '" placeholder="e.g. Side cupboard by the door"></label></div>'
        + '<div class="form-row"><label class="input-label" style="flex:1">Inside another location (optional)<select id="f_loc_parent">' + parentOpts + '</select></label></div>'
        + '<div style="margin-bottom:16px;"><div style="font-size:12px;color:#7a8f78;margin-bottom:8px;">Icon (optional)</div>'
        + '<input type="hidden" id="f_loc_icon" value="' + escHtml(loc&&loc.icon||'') + '">'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + iconPicker + '</div></div>'
        + '<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">'
        + '<button type="button" class="btn-primary" onclick="saveLoc()">Save</button>'
        + '<button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div>';
}

function pickLocIcon(btn, icon) {
    icon = icon || btn.dataset.icon;
    document.getElementById('f_loc_icon').value = icon;
    var btns = btn.closest('div').querySelectorAll('button');
    btns.forEach(function(b) { b.style.background = '#0f1a0f'; b.style.borderColor = '#2a4a2a'; });
    btn.style.background = '#2a4a2a'; btn.style.borderColor = '#6dbf5a';
}

function saveLoc() {
    const name = document.getElementById('f_loc_name').value.trim();
    if (!name) { alert('Name is required.'); return; }
    const locs = loadLocations();
    const existing = locs.find(function(l) { return l.name === name && Number(l.id) !== Number(editingLocId); });
    if (existing) { alert('A location with that name already exists.'); return; }
    const parentEl = document.getElementById('f_loc_parent');
    const parentId = parentEl && parentEl.value ? Number(parentEl.value) : null;
    const entry = { name: name, desc: document.getElementById('f_loc_desc').value.trim(), icon: document.getElementById('f_loc_icon').value, parent_id: parentId };
    if (editingLocId !== null) {
        const idx = locs.findIndex(function(l) { return Number(l.id) === Number(editingLocId); });
        const oldName = locs[idx] && locs[idx].name;
        entry.id = editingLocId;
        if (idx !== -1) locs[idx] = entry;
        if (oldName && oldName !== name) {
            const items = loadStockpile();
            items.forEach(function(item) { if (item.location === oldName) item.location = name; });
            saveStockpile(items);
        }
    } else {
        entry.id = locs.length ? Math.max.apply(null, locs.map(function(l) { return Number(l.id)||0; })) + 1 : 1;
        locs.push(entry);
    }
    saveLocations(locs);
    closeModal();
    renderPage();
}

function deleteLoc(id) {
    id = Number(id);
    const locs = loadLocations();
    const loc = locs.find(function(l) { return Number(l.id) === id; });
    if (!loc) return;
    if (!confirm('Delete location "' + loc.name + '"? Items assigned to it will become unassigned.')) return;
    const updatedLocs = locs.filter(function(l) { return Number(l.id) !== id; })
        .map(function(l) { return Number(l.parent_id) === id ? Object.assign({}, l, { parent_id: null }) : l; });
    saveLocations(updatedLocs);
    const items = loadStockpile();
    items.forEach(function(item) { if (item.location === loc.name) item.location = ''; });
    saveStockpile(items);
    renderPage();
}

function quickAddLoc(nameOrBtn) {
    const name = (typeof nameOrBtn === 'string') ? nameOrBtn : nameOrBtn.dataset.name;
    const locs = loadLocations();
    if (locs.find(function(l) { return l.name === name; })) return;
    const id = locs.length ? Math.max.apply(null, locs.map(function(l) { return Number(l.id)||0; })) + 1 : 1;
    locs.push({ id: id, name: name, desc: '', icon: '' });
    saveLocations(locs);
    renderPage();
}



function renderPowerSummary(items) {
    const loads = loadPowerLoads();
    const zone    = localStorage.getItem('rpn_solar_zone')    || 'moderate';
    const season  = localStorage.getItem('rpn_solar_season')  || 'spring_autumn';
    const weather = localStorage.getItem('rpn_solar_weather') || 'good';
    const psh = getSolarPsh(zone, season, weather);
    const b = calculatePowerBudget(items, loads, psh);
    const hasSources = b.totalStoredWh > 0 || b.solarWday > 0;

    const statusLabel = hasSources && loads.length && b.statusLevel
        ? { strong_surplus:'⚡ Strong Surplus', sustainable:'✓ Sustainable', marginal:'⚠ Marginal', draining:'↘ Slowly Draining', unsustainable:'✕ Unsustainable' }[b.statusLevel]
        : hasSources ? `${b.usableStoredWh} Wh usable` : null;

    const statusColor = b.statusLevel
        ? (['strong_surplus','sustainable'].includes(b.statusLevel) ? '#6dbf5a' : ['marginal','draining'].includes(b.statusLevel) ? '#d4a017' : '#c0392b')
        : '#7a8f78';

    return `<div style="margin-top:12px;background:#0d170d;border:1px solid #2a4a2a;border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
            <div style="font-size:11px;color:#7a8f78;margin-bottom:3px;">POWER BUDGET</div>
            <div style="font-size:14px;font-weight:600;color:${statusColor};">${statusLabel || 'No devices configured'}</div>
            ${loads.length ? `<div style="font-size:11px;color:#4a5e48;margin-top:2px;">${loads.length} device${loads.length===1?'':'s'} · ${b.totalWday} Wh/day</div>` : ''}
        </div>
        <a href="power.html" style="flex-shrink:0;background:#2a4a2a;border:1px solid #3a7a2a;color:#6dbf5a;font-size:12px;padding:7px 12px;border-radius:6px;text-decoration:none;white-space:nowrap;">Open Power →</a>
    </div>
    <div style="font-size:11px;color:#4a5e48;margin-top:6px;line-height:1.6;padding:0 2px;">
        Add energy <strong style="color:#556655;">sources</strong> here (batteries, solar panels, generators). To add devices that <em>run off</em> your power (radio, laptop, lights), use the <a href="power.html" style="color:#6dbf5a;">⚡ Power</a> tab.
    </div>`;
}

function filterTable(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#tableWrap tbody tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}

function buildForm(item) {
    const isFood  = (item && item.category === 'Food') || false;
    const isPower = (item && item.category === 'Power') || false;
    const catOpts   = CATEGORIES.map(c => `<option value="${escHtml(c)}"${item && item.category===c?' selected':''}>${escHtml(c)}</option>`).join('');
    const foodOpts  = FOOD_TYPES.map(f => `<option value="${escHtml(f)}"${item && item.food_type===f?' selected':''}>${escHtml(f)}</option>`).join('');
    const powerOpts = POWER_TYPES.map(p => `<option value="${escHtml(p)}"${item && item.power_type===p?' selected':''}>${escHtml(p)}</option>`).join('');
    const curPT = item?.power_type || 'Generator';
    const isGen   = isPower && curPT === 'Generator';
    const isWh    = isPower && ['Power Bank','Battery Pack','UPS'].includes(curPT);
    const isSolar = isPower && curPT === 'Solar Panel';

    return `
    <div class="form-row">
        <label class="input-label">Name<input type="text" id="f_name" value="${escHtml(item?.name||'')}" placeholder="e.g. Honda EU22i" required></label>
        <label class="input-label">Category
            <select id="f_category" onchange="toggleCategoryFields(this.value)">${catOpts}</select>
        </label>
    </div>
    <div class="form-row" id="foodRow" style="display:${isFood?'flex':'none'}">
        <label class="input-label">Food Type<select id="f_food_type">${foodOpts}</select></label>
        <label class="input-label">Cal/100g (auto if blank)<input type="number" id="f_cal" value="${escHtml(item?.calories_per_100g||'')}" placeholder="auto"></label>
    </div>
    <p id="foodHint" class="form-hint" style="display:${isFood?'block':'none'};margin-top:-6px;">Cal/100g is used to estimate calorie reserves. If left blank, a default value for the selected food type is used. For tinned food, check the label — typical values: beans 70–120 kcal, meat 150–200 kcal, pasta 350 kcal, rice 360 kcal.</p>
    <div id="powerHint" style="display:${isPower?'block':'none'};background:#0d1a0d;border:1px solid #2a4a2a;border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#7a8f78;line-height:1.6;">
        <strong style="color:#6dbf5a;">Energy sources go here</strong> — batteries, solar panels, and generators that store or produce power.<br>
        For devices that <em>use</em> power (radio, laptop, lights etc.) go to the <a href="power.html" style="color:#6dbf5a;">⚡ Power</a> tab and add them to your device list.
    </div>
    <div class="form-row" id="powerTypeRow" style="display:${isPower?'flex':'none'}">
        <label class="input-label" style="flex:1">Power Type
            <select id="f_power_type" onchange="togglePowerFields(this.value)">${powerOpts}</select>
        </label>
    </div>
    <div id="generatorFields" style="display:${isGen?'block':'none'}">
        <div class="form-row">
            <label class="input-label">Output (W)<input type="number" id="f_output_w" value="${escHtml(item?.output_w||'')}" placeholder="e.g. 2200"></label>
            <label class="input-label">Consumption (L/hr)<input type="number" id="f_consumption_lph" step="0.1" value="${escHtml(item?.fuel_consumption_lph||'')}" placeholder="e.g. 0.9"></label>
        </div>
        <div class="form-row">
            <label class="input-label">Fuel Available (L)<input type="number" id="f_fuel_litres" step="0.1" value="${escHtml(item?.fuel_litres||'')}" placeholder="e.g. 10"></label>
            <label class="input-label">Fuel Type<input type="text" id="f_fuel_type" value="${escHtml(item?.fuel_type||'')}" placeholder="e.g. Petrol, LPG"></label>
        </div>
    </div>
    <div id="storedWhFields" style="display:${isWh?'block':'none'}">
        <p class="form-hint" style="margin-bottom:6px;">Enter capacity as Wh (e.g. 500Wh from the spec sheet), or as Ah + Voltage (e.g. 100Ah × 12V = 1200Wh). Most lithium power stations list Wh; car batteries and LiFePO4 banks typically list Ah.</p>
        <div style="display:flex;gap:8px;margin-bottom:6px;">
            <button type="button" id="btn_wh_mode" onclick="setCapacityMode('wh')"
                style="flex:1;padding:7px;font-size:12px;border-radius:5px;cursor:pointer;border:1px solid #3a5c2e;background:${!item?.capacity_ah?'#2a4a2a':'#1a2a1a'};color:${!item?.capacity_ah?'#6dbf5a':'#7a8f78'};">
                Wh (watt-hours)
            </button>
            <button type="button" id="btn_ah_mode" onclick="setCapacityMode('ah')"
                style="flex:1;padding:7px;font-size:12px;border-radius:5px;cursor:pointer;border:1px solid #3a5c2e;background:${item?.capacity_ah?'#2a4a2a':'#1a2a1a'};color:${item?.capacity_ah?'#6dbf5a':'#7a8f78'};">
                Ah + Voltage
            </button>
        </div>
        <div id="wh_input" class="form-row" style="display:${item?.capacity_ah?'none':'flex'}">
            <label class="input-label" style="flex:1">Capacity (Wh)
                <input type="number" id="f_capacity_wh" value="${escHtml(item?.capacity_wh||'')}" placeholder="e.g. 500">
            </label>
        </div>
        <div id="ah_input" class="form-row" style="display:${item?.capacity_ah?'flex':'none'}">
            <label class="input-label">Capacity (Ah)
                <input type="number" id="f_capacity_ah" value="${escHtml(item?.capacity_ah||'')}" placeholder="e.g. 100" oninput="updateWhPreview()">
            </label>
            <label class="input-label">Voltage (V)
                <input type="number" id="f_voltage" value="${escHtml(item?.voltage||'12')}" placeholder="e.g. 12" oninput="updateWhPreview()">
            </label>
        </div>
        <div id="wh_preview" style="display:${item?.capacity_ah?'block':'none'};font-size:12px;color:#6dbf5a;padding:4px 0 8px;">
            = ${item?.capacity_ah && item?.voltage ? Math.round(Number(item.capacity_ah)*Number(item.voltage))+'Wh' : ''}
        </div>
    </div>
    <div id="solarFields" class="form-row" style="display:${isSolar?'flex':'none'}">
        <label class="input-label">Panel Output (W)<input type="number" id="f_solar_w" value="${escHtml(item?.output_w||'')}" placeholder="e.g. 100"></label>
    </div>
    <div class="form-row" id="weightRow" style="display:${isPower?'none':'flex'}">
        <label class="input-label">Quantity<input type="text" id="f_qty" value="${escHtml(item?.quantity||'')}" placeholder="e.g. 3 bags"></label>
        <label class="input-label" id="weightLabel">${item?.category === 'Water' ? 'Volume (Litres)' : 'Weight (g)'}
            <input type="number" id="f_weight"
                value="${escHtml(item?.category === 'Water' && item?.weight_g ? String(Number(item.weight_g)/1000) : (item?.weight_g||''))}"
                placeholder="${item?.category === 'Water' ? 'litres' : 'grams'}">
        </label>
    </div>
    <div class="form-row" id="powerQtyRow" style="display:${isPower?'flex':'none'}">
        <label class="input-label">Quantity<input type="number" id="f_power_qty" value="${escHtml(item?.quantity||'')}" placeholder="1"></label>
    </div>
    <div class="form-row" id="petRow" style="display:${item?.category==='Pet Food'?'flex':'none'}">
        <label class="input-label">Pet Portions/Day<input type="number" id="f_pet" value="${escHtml(item?.pet_portions||'')}" placeholder="portions per day"></label>
    </div>
    <div class="form-row">
        <label class="input-label">Added Date<input type="date" id="f_added" value="${escHtml(item?.added||'')}"></label>
        <label class="input-label">Expiry Date<input type="date" id="f_expiry" value="${escHtml(item?.expiry||'')}"></label>
    </div>
    <div class="form-row">
        <label class="input-label" style="flex:2">Location
            <select id="f_location" onchange="handleLocSelect(this)">
                <option value="">-- No location --</option>
                ${(function(){
                    const locs = loadLocations();
                    const tree = getLocTree(locs);
                    const cur = (item && item.location) || '';
                    let opts = '';
                    tree.forEach(function(node) {
                        const l = node.loc;
                        const prefix = node.depth > 0 ? '  › ' : '';
                        opts += '<option value="' + l.name.replace(/"/g,'&quot;') + '"' + (cur===l.name?' selected':'') + '>' + prefix + (l.icon?l.icon+' ':'') + l.name + '</option>';
                    });
                    if (cur && !locs.find(function(l){return l.name===cur;})) opts += '<option value="' + cur.replace(/"/g,'&quot;') + '" selected>' + cur + '</option>';
                    opts += '<option value="__new__">+ Add new location...</option>';
                    return opts;
                })()}
            </select>
        </label>
    </div>
    <div class="form-row" id="newLocRow" style="display:none;">
        <label class="input-label" style="flex:2">New location name<input type="text" id="f_location_new" placeholder="e.g. Garden Shed"></label>
    </div>
    <div class="form-row">
        <label class="input-label" style="flex:2">Notes<input type="text" id="f_notes" value="${escHtml(item?.notes||'')}" placeholder="Optional notes"></label>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
        <button type="button" class="btn-primary" onclick="saveItem()">Save</button>
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>`;
}

function toggleCategoryFields(val) {
    const isPower = val === 'Power';
    document.getElementById('foodRow').style.display     = val === 'Food' ? 'flex' : 'none';
    document.getElementById('foodHint').style.display    = val === 'Food' ? 'block' : 'none';
    document.getElementById('petRow').style.display      = val === 'Pet Food' ? 'flex' : 'none';
    document.getElementById('powerHint').style.display    = isPower ? 'block' : 'none';
    document.getElementById('powerTypeRow').style.display = isPower ? 'flex' : 'none';
    document.getElementById('weightRow').style.display   = isPower ? 'none' : 'flex';
    document.getElementById('powerQtyRow').style.display = isPower ? 'flex' : 'none';
    if (isPower) {
        togglePowerFields(document.getElementById('f_power_type')?.value || 'Generator');
    } else {
        document.getElementById('generatorFields').style.display = 'none';
        document.getElementById('storedWhFields').style.display  = 'none';
        document.getElementById('solarFields').style.display     = 'none';
    }
    const wLabel = document.getElementById('weightLabel');
    const wInput = document.getElementById('f_weight');
    if (val === 'Water') {
        wLabel.childNodes[0].textContent = 'Volume (Litres)';
        wInput.placeholder = 'litres';
        wInput.value = '';
    } else if (!isPower) {
        wLabel.childNodes[0].textContent = 'Weight (g)';
        wInput.placeholder = 'grams';
        wInput.value = '';
    }
}

function togglePowerFields(val) {
    document.getElementById('generatorFields').style.display = val === 'Generator' ? 'block' : 'none';
    document.getElementById('storedWhFields').style.display  = ['Power Bank','Battery Pack','UPS'].includes(val) ? 'block' : 'none';
    document.getElementById('solarFields').style.display     = val === 'Solar Panel' ? 'flex' : 'none';
}

function setCapacityMode(mode) {
    const isAh = mode === 'ah';
    document.getElementById('wh_input').style.display  = isAh ? 'none' : 'flex';
    document.getElementById('ah_input').style.display  = isAh ? 'flex' : 'none';
    document.getElementById('wh_preview').style.display = isAh ? 'block' : 'none';
    document.getElementById('btn_wh_mode').style.background = isAh ? '#1a2a1a' : '#2a4a2a';
    document.getElementById('btn_wh_mode').style.color      = isAh ? '#7a8f78' : '#6dbf5a';
    document.getElementById('btn_ah_mode').style.background = isAh ? '#2a4a2a' : '#1a2a1a';
    document.getElementById('btn_ah_mode').style.color      = isAh ? '#6dbf5a' : '#7a8f78';
}

function updateWhPreview() {
    const ah = parseFloat(document.getElementById('f_capacity_ah')?.value) || 0;
    const v  = parseFloat(document.getElementById('f_voltage')?.value) || 0;
    const el = document.getElementById('wh_preview');
    if (el) el.textContent = ah && v ? '= ' + Math.round(ah * v) + ' Wh' : '';
}

function handleLocSelect(sel) {
    var row = document.getElementById('newLocRow');
    if (row) row.style.display = sel.value === '__new__' ? 'flex' : 'none';
}

function getSelectedLocation() {
    var sel = document.getElementById('f_location');
    if (!sel) return '';
    if (sel.value === '__new__') {
        var newEl = document.getElementById('f_location_new');
        return newEl ? newEl.value.trim() : '';
    }
    return sel.value;
}

function openAdd() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Item';
    document.getElementById('modalBody').innerHTML = buildForm(null);
    document.getElementById('modalOverlay').style.display = 'block';
    // set today as default added date
    document.getElementById('f_added').value = new Date().toISOString().slice(0,10);
}

function openEdit(id) {
    id = Number(id);
    const items = loadStockpile();
    const item = items.find(i => Number(i.id) === id);
    if (!item) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Item';
    document.getElementById('modalBody').innerHTML = buildForm(item);
    document.getElementById('modalOverlay').style.display = 'block';
}

function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
    editingId = null;
}

function saveItem() {
    const name = document.getElementById('f_name').value.trim();
    if (!name) { alert('Name is required.'); return; }
    const cat = document.getElementById('f_category').value;
    const isPower = cat === 'Power';
    const powerType = isPower ? document.getElementById('f_power_type').value : '';

    const newItem = {
        name,
        category: cat,
        food_type: cat === 'Food' ? document.getElementById('f_food_type').value : '',
        calories_per_100g: document.getElementById('f_cal')?.value ? Number(document.getElementById('f_cal').value) : '',
        quantity: isPower ? (document.getElementById('f_power_qty')?.value.trim()||'1') : document.getElementById('f_qty').value.trim(),
        weight_g: !isPower && document.getElementById('f_weight')?.value ? (cat === 'Water' ? Number(document.getElementById('f_weight').value) * 1000 : Number(document.getElementById('f_weight').value)) : '',
        pet_portions: document.getElementById('f_pet') ? document.getElementById('f_pet').value : '',
        power_type: powerType,
        output_w: powerType === 'Generator' ? (document.getElementById('f_output_w')?.value||'') : (powerType === 'Solar Panel' ? (document.getElementById('f_solar_w')?.value||'') : ''),
        fuel_consumption_lph: powerType === 'Generator' ? (document.getElementById('f_consumption_lph')?.value||'') : '',
        fuel_litres: powerType === 'Generator' ? (document.getElementById('f_fuel_litres')?.value||'') : '',
        fuel_type: powerType === 'Generator' ? (document.getElementById('f_fuel_type')?.value.trim()||'') : '',
        capacity_wh: ['Power Bank','Battery Pack','UPS'].includes(powerType) ? (() => {
            const ahEl = document.getElementById('f_capacity_ah');
            const vEl  = document.getElementById('f_voltage');
            if (ahEl && ahEl.closest && ahEl.closest('#ah_input')?.style.display !== 'none' && ahEl.value && vEl?.value) {
                return String(Math.round(Number(ahEl.value) * Number(vEl.value)));
            }
            return document.getElementById('f_capacity_wh')?.value || '';
        })() : '',
        capacity_ah: ['Power Bank','Battery Pack','UPS'].includes(powerType) ? (document.getElementById('f_capacity_ah')?.value||'') : '',
        voltage: ['Power Bank','Battery Pack','UPS'].includes(powerType) ? (document.getElementById('f_voltage')?.value||'') : '',
        added: document.getElementById('f_added').value,
        expiry: document.getElementById('f_expiry').value,
        location: getSelectedLocation(),
        notes: document.getElementById('f_notes').value.trim(),
    };

    const items = loadStockpile();
    if (editingId !== null) {
        const idx = items.findIndex(i => Number(i.id) === Number(editingId));
        if (idx !== -1) { newItem.id = editingId; items[idx] = newItem; }
    } else {
        newItem.id = nextId(items);
        items.push(newItem);
    }
    saveStockpile(items);
    closeModal();
    renderPage();
}

function deleteItem(id) {
    id = Number(id);
    if (!confirm('Delete this item?')) return;
    const items = loadStockpile().filter(i => Number(i.id) !== id);
    saveStockpile(items);
    renderPage();
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
