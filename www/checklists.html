<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — Checklists</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>
<main>
<div style="margin-bottom:12px;"><a href="home.html" style="color:#6dbf5a;font-size:13px;">&#8592; Home</a></div>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:#000a;z-index:500;overflow-y:auto;padding:20px;">
  <div style="max-width:480px;margin:0 auto;background:#1a2018;border:1px solid #3a5c2e;border-radius:8px;padding:24px;">
    <h2 style="margin-bottom:16px;">New Checklist</h2>
    <div class="form-row"><label class="input-label" style="flex:1">Name<input type="text" id="f_clname" placeholder="e.g. Vehicle Kit"></label></div>
    <div class="form-row"><label class="input-label" style="flex:1">Description<input type="text" id="f_cldesc" placeholder="Optional"></label></div>
    <p class="form-hint">Add items after creating the list.</p>
    <div style="display:flex;gap:10px;margin-top:4px;">
        <button type="button" class="btn-primary" onclick="createList()">Create</button>
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="pageContent"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script>
let _builtins = [];

function init() {
    renderNav('checklists');
    loadJSON('data/checklists.json').then(data => {
        _builtins = data;
        renderPage();
    }).catch(() => { _builtins = []; renderPage(); });
}

function toggleSkipList(id, e) {
    e.preventDefault(); e.stopPropagation();
    const skippedLists = loadSkippedLists();
    const idx = skippedLists.indexOf(id);
    if (idx === -1) skippedLists.push(id); else skippedLists.splice(idx, 1);
    saveSkippedLists(skippedLists);
    renderPage();
}

function renderPage() {
    const progress = loadProgress();
    const skipped = loadSkipped();
    const skippedLists = loadSkippedLists();
    const customData = loadCustomChecklists();
    const reviews = loadChecklistReviews();
    const allLists = [..._builtins, ...(customData.custom_checklists || [])];

    const cards = allLists.map(cl => {
        cl.name = cl.name || cl.title || 'Untitled';
        const isSkippedList = skippedLists.includes(cl.id);
        const items = mergeChecklist(cl, customData.overrides || {}, progress, skipped);
        const active = items.filter(i => !i.skipped);
        const done = active.filter(i => i.checked).length;
        const total = active.length;
        const pct = total > 0 ? Math.round(done/total*100) : 0;
        const fillClass = pct >= 100 ? 'complete' : pct > 0 ? 'partial' : '';
        const lastReviewed = reviews[cl.id] || null;
        const reviewDays = lastReviewed ? daysSince(lastReviewed) : null;
        const reviewOverdue = pct >= 100 && (reviewDays === null || reviewDays > 90);
        const reviewBadge = reviewOverdue ? `<span style="display:inline-block;font-size:10px;color:#d4a017;background:#2e1a0a;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:6px;">Review due</span>` : '';
        if (isSkippedList) {
            return `<div class="checklist-card" style="opacity:0.4;pointer-events:none;position:relative;">
                <div class="checklist-card-header">
                    <span class="checklist-title" style="text-decoration:line-through;">${escHtml(cl.name)}</span>
                    <span style="font-size:11px;color:#556655;font-weight:600;">N/A</span>
                </div>
                <div style="position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:flex-end;padding:10px;">
                    <button onclick="toggleSkipList('${escHtml(cl.id)}', event)"
                        style="background:#1a2a1a;border:1px solid #2a4a2a;color:#6dbf5a;font-size:12px;padding:5px 12px;border-radius:4px;cursor:pointer;">Undo N/A</button>
                </div>
            </div>`;
        }
        return `<div style="position:relative;">
            <a href="checklist-detail.html?id=${encodeURIComponent(cl.id)}" class="checklist-card" style="display:block;">
                <div class="checklist-card-header">
                    <span class="checklist-title">${escHtml(cl.name)}</span>
                    <span class="checklist-count">${done}/${total}</span>
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill ${fillClass}" style="width:${pct}%"></div>
                </div>
                ${cl.description ? `<span class="checklist-desc">${escHtml(cl.description)}</span>` : ''}
                ${reviewBadge}
            </a>
            <button onclick="toggleSkipList('${escHtml(cl.id)}', event)"
                style="position:absolute;top:8px;right:8px;background:none;border:1px solid #2a4a2a;color:#4a5e48;font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;">N/A</button>
        </div>`;
    }).join('');

    const stats = checklistStats(_builtins);
    const pct = stats.pct;
    const fillClass = pct >= 80 ? 'complete' : pct >= 40 ? 'partial' : '';

    document.getElementById('pageContent').innerHTML = `
        <div style="margin-bottom:16px;">
            <span class="detail-progress-label">Overall progress: ${stats.done}/${stats.total} items (${pct}%)</span>
            <div class="progress-bar-wrap large"><div class="progress-bar-fill ${fillClass}" style="width:${pct}%"></div></div>
        </div>
        <div class="page-actions">
            <button class="btn-primary" onclick="openModal()">+ New Checklist</button>
        </div>
        <div style="font-size:12px;color:#4a5e48;line-height:1.6;margin-bottom:14px;padding:10px 12px;background:#0d170d;border-radius:6px;border:1px solid #1a2a1a;">
            <strong style="color:#556655;">Don't see a list that fits you?</strong> Tap <strong style="color:#556655;">N/A</strong> on any pre-made list to remove it from your readiness score — it won't count against you. Use <strong style="color:#556655;">+ New Checklist</strong> to build your own from scratch.
        </div>
        <div class="checklist-grid">${cards || '<p class="empty">No checklists found.</p>'}</div>
    `;
}

function openModal()  { document.getElementById('modalOverlay').style.display = 'block'; document.getElementById('f_clname').focus(); }
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

function createList() {
    const name = document.getElementById('f_clname').value.trim();
    if (!name) { alert('Name required.'); return; }
    const desc = document.getElementById('f_cldesc').value.trim();
    const id = 'custom-' + Date.now();
    const customData = loadCustomChecklists();
    customData.custom_checklists = customData.custom_checklists || [];
    customData.custom_checklists.push({ id, name, description: desc, items: [] });
    saveCustomChecklists(customData);
    closeModal();
    window.location.href = `checklist-detail.html?id=${encodeURIComponent(id)}`;
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
