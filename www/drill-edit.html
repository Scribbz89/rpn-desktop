<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPN Field Brain — Edit Drill</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .step-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .step-row { display: flex; gap: 10px; align-items: flex-start; }
        .step-row-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .step-row input { width: 100%; box-sizing: border-box; }
        .step-row-actions { display: flex; gap: 6px; }
        .step-num-badge { min-width: 28px; height: 28px; border-radius: 50%; background: #2e3d2c; color: #6dbf5a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; margin-top: 6px; }
        .btn-move { background: none; border: 1px solid #2e3d2c; color: #4a5e48; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
        .btn-move:hover { border-color: #6dbf5a; color: #6dbf5a; }
        .btn-remove { background: none; border: 1px solid #4a2a2a; color: #c0392b; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
        .btn-remove:hover { background: #2e1a1a; }
    </style>
</head>
<body>
<div id="nav-root"></div>
<main style="max-width:680px;">
    <div style="margin-bottom:16px;"><a href="drills.html" style="color:#6dbf5a;font-size:13px;">&#8592; All Drills</a></div>
    <div id="pageContent"><p class="empty">Loading...</p></div>
</main>

<script src="js/storage.js"></script>
<script src="js/drill-overlay.js"></script><script src="js/nav.js"></script><script src="js/help.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const drillId  = params.get('id');
const isCustom = params.get('custom') === '1';
const isNew    = params.get('new') === '1';

let _drill = null;
let _steps = [];
let _isCustom = isCustom;

function init() {
    renderNav('drills');
    if (isNew) {
        _drill = { id: 'custom-' + Date.now(), name: '', category: 'Custom', icon: '⚡', description: '', target_time: 600, steps: [] };
        _steps = [];
        _isCustom = true;
        renderEditor();
        return;
    }
    loadJSON('data/drills.json').then(builtins => {
        if (isCustom) {
            const data = loadDrillData();
            _drill = (data.custom || []).find(d => d.id === drillId);
            _isCustom = true;
        } else {
            _drill = builtins.find(d => d.id === drillId);
            _isCustom = false;
        }
        if (!_drill) { document.getElementById('pageContent').innerHTML = '<p class="empty">Drill not found.</p>'; return; }
        _steps = [...getDrillSteps(_drill)];
        renderEditor();
    });
}

function renderEditor() {
    const name = isNew ? '' : getDrillName(_drill);
    const targetTime = isNew ? 600 : getDrillTargetTime(_drill);
    const mins = Math.floor(targetTime / 60);
    const secs = targetTime % 60;
    const isBuiltin = !_isCustom;

    const stepsHtml = _steps.map((step, idx) => `
        <div class="step-row" id="stepRow${idx}">
            <span class="step-num-badge">${idx+1}</span>
            <div class="step-row-body">
                <input type="text" id="step_${idx}" value="${escHtml(step)}" placeholder="Describe this step...">
                <div class="step-row-actions">
                    <button class="btn-move" onclick="moveStep(${idx},-1)">&#8593; Up</button>
                    <button class="btn-move" onclick="moveStep(${idx},1)">&#8595; Down</button>
                    <button class="btn-remove" onclick="removeStep(${idx})">&#10005; Remove</button>
                </div>
            </div>
        </div>`).join('');

    document.getElementById('pageContent').innerHTML = `
        <h2 style="margin-bottom:16px;">${isNew ? 'New Custom Drill' : 'Edit Drill'}</h2>

        ${isBuiltin ? '<div style="background:#141c12;border:1px solid #3a5c2e;border-radius:6px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#7a8f78;">Editing a built-in drill. Your changes are saved as a personal override — the original template is not affected.</div>' : ''}

        <div class="add-form">
            <h3 style="margin-bottom:14px;">Drill Details</h3>
            <div class="form-row">
                <label class="input-label" style="flex:2">Name<input type="text" id="f_name" value="${escHtml(name)}" placeholder="e.g. My Bug-Out Drill"></label>
                <label class="input-label">Category<input type="text" id="f_category" value="${escHtml(_drill.category||'')}" placeholder="e.g. Evacuation"></label>
            </div>
            <div class="form-row">
                <label class="input-label" style="flex:2">Description<input type="text" id="f_desc" value="${escHtml(_drill.description||'')}" placeholder="What does this drill test?"></label>
            </div>
            <div class="form-row">
                <label class="input-label">Target Minutes<input type="number" id="f_mins" value="${mins}" min="0" placeholder="0"></label>
                <label class="input-label">Target Seconds<input type="number" id="f_secs" value="${secs}" min="0" max="59" placeholder="0"></label>
            </div>
        </div>

        <div class="add-form">
            <h3 style="margin-bottom:14px;">Steps</h3>
            <p class="form-hint">Personalise these to match your exact setup — your actual bag location, your frequencies, your rally points.</p>
            <div class="step-editor" id="stepEditor">${stepsHtml}</div>
            <button type="button" class="btn-cancel" onclick="addStep()">+ Add Step</button>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
            <button class="btn-primary" onclick="save()">Save Drill</button>
            <a href="drills.html" class="btn-cancel" style="text-decoration:none;">Cancel</a>
            ${_isCustom && !isNew ? `<button class="btn-delete" onclick="deleteDrill()" style="margin-left:auto;">Delete Drill</button>` : ''}
        </div>
        <div id="savedMsg" style="display:none;color:#6dbf5a;font-size:13px;margin-top:12px;">&#10003; Saved.</div>
    `;
}

function addStep() {
    _steps.push('');
    renderEditor();
    // focus new step
    setTimeout(() => {
        const inputs = document.querySelectorAll('[id^="step_"]');
        if (inputs.length) inputs[inputs.length-1].focus();
    }, 50);
}

function removeStep(idx) {
    collectSteps();
    _steps.splice(idx, 1);
    renderEditor();
}

function moveStep(idx, dir) {
    collectSteps();
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= _steps.length) return;
    [_steps[idx], _steps[newIdx]] = [_steps[newIdx], _steps[idx]];
    renderEditor();
}

function collectSteps() {
    _steps = _steps.map((_, idx) => {
        const el = document.getElementById('step_' + idx);
        return el ? el.value.trim() : '';
    }).filter(s => s !== '');
}

function save() {
    collectSteps();
    const name = document.getElementById('f_name').value.trim();
    if (!name) { alert('Name is required.'); return; }
    const targetTime = (Number(document.getElementById('f_mins').value)||0)*60 + (Number(document.getElementById('f_secs').value)||0);

    const data = loadDrillData();

    if (_isCustom) {
        // Save as custom drill
        data.custom = data.custom || [];
        const existing = data.custom.find(d => d.id === _drill.id);
        const drillObj = { id: _drill.id, name, category: document.getElementById('f_category').value.trim(), icon: _drill.icon || '⚡', description: document.getElementById('f_desc').value.trim(), target_time: targetTime, steps: _steps };
        if (existing) Object.assign(existing, drillObj);
        else data.custom.push(drillObj);
    } else {
        // Save as override for built-in drill
        data.overrides = data.overrides || {};
        data.overrides[_drill.id] = { name, target_time: targetTime, steps: _steps };
    }

    saveDrillData(data);
    document.getElementById('savedMsg').style.display = 'block';
    setTimeout(() => window.location.href = 'drills.html', 800);
}

function deleteDrill() {
    if (!confirm('Delete this custom drill? This cannot be undone.')) return;
    const data = loadDrillData();
    data.custom = (data.custom || []).filter(d => d.id !== _drill.id);
    saveDrillData(data);
    window.location.href = 'drills.html';
}

init();
</script>
</body>
</html>
